name: flutter_encrypted_audio_recorder
description: "Transparent, privacy-compliant encrypted audio recorder with call listener service, settings storage, and AES-256 GCM local storage."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  record: ^5.2.1
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.0.0
  permission_handler: ^11.3.1
  flutter_foreground_task: ^6.1.1
  path_provider: ^2.1.2
  intl: ^0.19.0
  sqflite: ^2.3.0
  path: ^1.9.0
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  record_linux: 1.3.1
  record_platform_interface: 1.6.0


